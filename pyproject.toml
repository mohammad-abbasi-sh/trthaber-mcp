[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trthaber-mcp"
version = "0.1.0"
description = "Unofficial read-only MCP server for trthaber.com (TRT Haber) news: headlines, breaking news, articles, search"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
    "curl-cffi>=0.7,<1.0",
]
authors = [{ name = "Mohammad Abbasi" }]

[project.scripts]
trthaber-mcp = "trthaber_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trthaber_mcp"]
